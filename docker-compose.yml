version: '3.8'

services:
  # 1. MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: kodra-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: kodra_dev
    volumes:
      - mongo_data:/data/db
    networks:
      - kodra-net

  # 2. Kodra Backend Server
  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: kodra-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/kodra_dev
      STORAGE_BASE_PATH: /app/server/workspaces
    volumes:
      - ./server:/app/server
      - ./shared:/app/shared
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - mongodb
    networks:
      - kodra-net

  # 3. Kodra Frontend Web IDE
  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: kodra-client
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:5000/api/v1
      VITE_WS_BASE_URL: ws://localhost:5000
    volumes:
      - ./client:/app/client
      - ./shared:/app/shared
    depends_on:
      - backend
    networks:
      - kodra-net

volumes:
  mongo_data:

networks:
  kodra-net:
    driver: bridge
