# ==============================================================================
# KODRA PRODUCTION REVERSE PROXY & WILDCARD SSL GATEWAY
# ==============================================================================

# Upstream Backend Pool
upstream kodra_backend {
    server backend:5000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Upstream Frontend Pool
upstream kodra_frontend {
    server client:80;
}

# 1. HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name kodra.dev *.kodra.dev preview.kodra.dev *.preview.kodra.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Wildcard Subdomain Gateway (*.preview.kodra.dev)
# Dynamically routes project preview traffic to Kodra reverse proxy engine
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ~^(?<subdomain>[a-zA-Z0-9_-]+)\.preview\.kodra\.dev$;

    ssl_certificate /etc/letsencrypt/live/preview.kodra.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/preview.kodra.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50M;

    location / {
        proxy_pass http://kodra_backend;
        proxy_http_version 1.1;

        # WebSocket support for Vite / Webpack HMR
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Kodra-Wildcard-Subdomain $subdomain;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

# 3. Main Web Application (app.kodra.dev / api.kodra.dev)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.kodra.dev api.kodra.dev kodra.dev;

    ssl_certificate /etc/letsencrypt/live/kodra.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kodra.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 50M;

    # API Endpoints
    location /api/ {
        proxy_pass http://kodra_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # WebSockets (Terminal PTY & Agent token stream)
    location /ws/ {
        proxy_pass http://kodra_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Web IDE Frontend Single Page Application
    location / {
        proxy_pass http://kodra_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
